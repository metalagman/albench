openapi: 3.0.3
info:
  title: albench Cloud Native API
  description: Standard cloud-native API server contract for albench compile-time benchmarks
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Liveness health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /metrics:
    get:
      summary: Prometheus / OpenMetrics telemetry endpoint
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics formatted text
          content:
            text/plain:
              schema:
                type: string
  /api/v1/items:
    get:
      summary: List all items
      operationId: listItems
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      summary: Create a new item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Invalid item payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/items/{id}:
    get:
      summary: Get item by ID
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete item by ID
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Item deleted successfully
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadyResponse:
      type: object
      required:
        - ready
      properties:
        ready:
          type: boolean
          example: true
    Item:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: string
          example: item-1
        name:
          type: string
          example: Widget
        description:
          type: string
          example: A high performance widget
        created_at:
          type: string
          format: date-time
          example: '2026-11-10T09:00:00Z'
    CreateItemRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Widget
        description:
          type: string
          example: A high performance widget
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Item not found
